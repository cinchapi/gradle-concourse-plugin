version: 2.1

executors:
  java:
    docker:
      - image: cimg/openjdk:8.0
    working_directory: ~/repo
    environment:
      GRADLE_OPTS: "-Djenkins=true -Dorg.gradle.daemon=false"
      TERM: dumb
      CONTAINER_BUILD: "true"

commands:
  restore_gradle_cache:
    steps:
      - restore_cache:
          keys:
            - v1-gradle-{{ checksum "build.gradle" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - v1-gradle-{{ checksum "build.gradle" }}
            - v1-gradle-

  save_gradle_cache:
    steps:
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: v1-gradle-{{ checksum "build.gradle" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}

jobs:
  build:
    executor: java
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Build and Test
          command: ./gradlew clean build
      - save_gradle_cache
      - store_test_results:
          path: build/test-results
      - store_artifacts:
          path: build/libs

  publish:
    executor: java
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Publish Plugin
          command: ./gradlew clean publishPlugins
      - save_gradle_cache

workflows:
  version: 2
  build-and-publish:
    jobs:
      - build
      - publish:
          requires:
            - build
          filters:
            branches:
              only: master

