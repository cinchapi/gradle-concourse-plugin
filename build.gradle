plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '1.3.0'
    id 'maven-publish'
    id 'signing'
}

group = 'com.cinchapi'
version = '1.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    testImplementation 'junit:junit:4.13.2'
}

gradlePlugin {
    website = 'https://github.com/cinchapi/gradle-concourse-plugin'
    vcsUrl = 'https://github.com/cinchapi/gradle-concourse-plugin'

    plugins {
        concoursePlugin {
            id = 'com.cinchapi.concourse-plugin'
            displayName = 'Concourse Plugin Bundle'
            description = 'A Gradle plugin to bundle Concourse plugins.'
            tags.set(['concourse', 'distribution'])
            implementationClass = 'com.cinchapi.gradle.concourse.plugin.ConcoursePluginPlugin'
        }
    }
}

publishing {
    publications {
        pluginMaven(MavenPublication) {
            pom {
                name = 'Gradle Concourse Plugin'
                description = 'A Gradle plugin to bundle Concourse plugins.'
                url = 'https://github.com/cinchapi/gradle-concourse-plugin'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'jnelson'
                        name = 'Jeff Nelson'
                        email = 'jeff@cinchapi.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/cinchapi/gradle-concourse-plugin.git'
                    developerConnection = 'scm:git:ssh://github.com:cinchapi/gradle-concourse-plugin.git'
                    url = 'https://github.com/cinchapi/gradle-concourse-plugin'
                }
            }
        }
    }
}

signing {
    // Only sign if signing credentials are available
    required { gradle.taskGraph.hasTask('publish') }
    sign publishing.publications
}

tasks.withType(Sign).configureEach {
    onlyIf { project.hasProperty('signing.keyId') }
}
